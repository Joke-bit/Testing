<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>APIcheck - Jaro Go WebGL</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      #jaro-bridge-status {
        position: fixed;
        bottom: 5px;
        left: 10px;
        font-family: monospace;
        font-size: 11px;
        color: #888;
        z-index: 9999;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">APIcheck</div>
      </div>
    </div>
    <div id="jaro-bridge-status">Jaro Go Bridge: Initializing...</div>

    <script>
      // Jaro App configuration
      window.JARO_HOST_ORIGIN = window.JARO_HOST_ORIGIN || "*";

      // Early message buffer: capture postMessage before Unity WASM has finished initializing
      window._pendingJaroGoHandoff = null;
      function deliverSessionToUnity(jsonStr) {
        if (!window.unityInstance) return false;
        try { window.unityInstance.SendMessage('JaroGameAPI', 'OnJaroSessionReceived', jsonStr); } catch (e) {}
        try { window.unityInstance.SendMessage('GameObject', 'OnJaroSessionReceived', jsonStr); } catch (e) {}
        return true;
      }

      window.addEventListener('message', function (event) {
        if (!event.data) return;
        try {
          var parsed = typeof event.data === 'object' ? event.data : JSON.parse(event.data);
          if (parsed.type === 'JARO_GAME_SESSION' || parsed.gameSessionToken) {
            console.log('[JaroGo Template] Early handoff received:', parsed);
            var jsonStr = typeof event.data === 'string' ? event.data : JSON.stringify(event.data);
            if (!deliverSessionToUnity(jsonStr)) {
              window._pendingJaroGoHandoff = jsonStr;
            }
            var statusDiv = document.getElementById('jaro-bridge-status');
            if (statusDiv) statusDiv.innerText = 'Jaro Go Bridge: Session Token Received';
          }
        } catch (e) {}
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Api.loader.js";
      var config = {
        dataUrl: buildUrl + "/Api.data.gz",
        frameworkUrl: buildUrl + "/Api.framework.js.gz",
        codeUrl: buildUrl + "/Api.wasm.gz",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "APIcheck",
        productVersion: "0.1",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          window.unityInstance = unityInstance;
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };

          var statusDiv = document.getElementById('jaro-bridge-status');
          if (statusDiv) statusDiv.innerText = 'Jaro Go Bridge: Unity Ready';

          // Deliver any early pending handoff
          if (window._pendingJaroGoHandoff) {
            console.log('[JaroGo Template] Delivering pending early handoff to Unity...');
            deliverSessionToUnity(window._pendingJaroGoHandoff);
            window._pendingJaroGoHandoff = null;
          }
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
